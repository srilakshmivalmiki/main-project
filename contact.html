<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <style>
        /* Global styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }

        header {
            background-color: #333;
            color: white;
            padding: 10px 0;
            text-align: center;
            transition: background-color 0.3s ease;
        }

        header:hover {
            background-color: #444;
        }

        .header-content h1 {
            margin: 0;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        nav ul li {
            display: inline-block;
            margin: 0 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #f0a500;
        }

        
        h1 {
            text-align: center;
            margin-top: 50px;
        }

        h2 {
            text-align: center;
            font-size: 20px;
            margin: 10px 0;
        }

        img {
            display: block;
            margin: 30px auto;
            width: 80%;
            max-width: 600px;
        }

        
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px 0;
            position: relative;
        }

        footer p {
            margin: 0;
            font-size: 16px;
        }

        footer .tooltip {
            display: none;
            position: absolute;
            bottom: 30px;
            background-color: #f0a500;
            color: black;
            padding: 5px 10px;
            border-radius: 5px;
        }

        footer:hover .tooltip {
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Our Business Blog</h1>
            <nav>
                <ul>
                    <li><a href="service.html">Services</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    
                </ul>
            </nav>
        </div>
    </header>

    <h1>Contact Us</h1>
    <h2>Phone: 9398550184</h2>
    <h2>Email: contact@ourbusiness.com</h2>

    <img src="https://tse2.mm.bing.net/th?id=OIP.WJqv0uiYImDckK570k5EKQHaE8&pid=Api&P=0&h=180" alt="Contact Us Image">

    <footer>
        <p>© 2025 Small Business Blog. All rights reserved.</p>
        <div class="tooltip">Thank you for reaching out to us!</div>
    </footer>
</body>
</html>
